[project]
name = "metrion"
version = "0.2.1"
description = "A Linux agent for monitoring process-level resource usage metrics to estimate per-process energy consumption."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license-files = ["LICENSE"]
authors = [
  {name = "Benjamin Weigell", email = "benjamin.weigell@uni-a.de"},
  {name = "Simon Hornung", email = "simon.hornung@uni-a.de"}
]


dependencies = [
    "psutil>=7.0.0,<8.0.0",
    "pynvml>=12.0.0,<13.0.0",
    "sqlalchemy>=2.0.40,<3.0.0",
    "loguru>=0.7.3",
    "polars>=1.44.1",
    "pyarrow>=20.0.0",
    "tqdm>=4.67.1",
    "sqlparse>=0.5.3",
    "rich>=13.0.0",
    "duckdb>=1.4.1",
    "duckdb-engine>=0.17.0",
    "numpy>=2.3.4",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "typer>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.3",       # linting & formatting
    "pre-commit>=4.2.0", # git hooks
    "torch>=2.6.0,<3.0.0",
    "pytest>=8.4.1",
    "memray>=1.19.1",
    "torchvision>=0.24.1",
    "vulture>=2.14",
    "maturin>=1.9.1", 
    "patchelf>=0.17.2.2",
    "ipykernel>=6.29.5", # notebooks in VS Code
    "nbformat>=5.10.4",
    "pandas>=2.2.3,<3.0.0",
    "matplotlib>=3.10.3", # evaluation plots
    "plotly>=6.2.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.14",
    "mkdocstrings[python]>=0.29.1",
]

[project.scripts]
metrion = "metrion.cli:app"

[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[tool.maturin]
# This tells maturin to place the Rust module inside the metrion package
module-name = "metrion.metrion_rust"

[tool.ruff]
lint.select = ["E", "W", "F", "N", "I", "UP", "B"]
target-version = "py312"
line-length = 120
format.line-ending = "lf"
# metrion_rust is a compiled module and bench/_common is imported from inside bench/, so ruff
# cannot find either as a source file and would sort them among the third-party imports.
lint.isort.known-first-party = ["metrion", "_common"]

[tool.pyright]
venvPath = "."
venv = ".venv"

