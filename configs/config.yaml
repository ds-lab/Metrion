general:
  database:
    type: duckdb
    path: ./monitor.db
  debug: true
  collection_interval: 10

energy_model:
  granularity: detailed
  components:
    cpu:
      mode: include
      power: auto
      metrics:
        - CPU_SOCKET_PKG_ENERGY
        - CPU_CORE_PID_WORK
        - CPU_CORE_PID_TIME
        # - CPU_CORE_PID_UNHALTED_CYCLES
        # - CPU_CORE_PID_MEM_LOAD_L3_MISS_LOCAL_DRAM
        # - CPU_CORE_PID_MEM_LOAD_L3_MISS_REMOTE_DRAM
    dram:
      mode: include
      power: auto
      metrics:
        - DRAM_SOCKET_TOTAL_ENERGY
        - DRAM_SOCKET_PID_MEMORY
    gpu:
      mode: include
      power: auto
      metrics:
        - GPU_DEVICE_TOTAL_ENERGY
        - GPU_DEVICE_PID_COMPUTE_UTILIZATION
    network:
      mode: include
      power: auto
      metrics: "*"