# Metrion Agent Configuration
# ============================

general:
  database:
    type: duckdb  # options: sqlite, duckdb
    path: ./monitor.db
  debug: true
  collection_interval: 10  # in seconds

energy_model:
  # Output detail level
  # - compressed: aggregate data for lower storage overhead
  # - detailed: full per-component breakdown
  granularity: detailed

  components:
    cpu:
      mode: include  # include | exclude
      # Power configuration: "auto" or list of subcomponent power settings
      power: auto
      # Or specify per-subcomponent power:
      # power:
      #   - id: package-0
      #     idle_power: 1.5  # in watts or "auto"
      #     max_power: 95.0  # in watts or "auto"
      #   - id: package-1
      #     idle_power: auto
      #     max_power: auto
      # Metrics to collect: "*" for all metrics, or list of specific metric names
      # Available CPU metrics:
      #   - CPU_SOCKET_PKG_ENERGY
      #   - CPU_SOCKET_PP0_ENERGY
      #   - CPU_CORE_PID_TIME
      #   - CPU_CORE_PID_WORK
      #   - CPU_CORE_PID_APERF
      #   - CPU_CORE_PID_MPERF
      #   - CPU_CORE_PID_UNHALTED_CYCLES
      #   - CPU_CORE_PID_EXECUTION_TYPE
      #   - CPU_CORE_PID_L2_MISS
      #   - CPU_CORE_PID_MEM_LOAD_L3_MISS_LOCAL_DRAM
      #   - CPU_CORE_PID_MEM_LOAD_L3_MISS_REMOTE_DRAM
      #   - CPU_CORE_PID_MEM_INST_RETIRED_ALL_STORES
      metrics:
        - CPU_SOCKET_PKG_ENERGY
        - CPU_CORE_PID_WORK
        - CPU_CORE_PID_TIME
        - CPU_CORE_PID_MEM_LOAD_L3_MISS_LOCAL_DRAM
        - CPU_CORE_PID_MEM_LOAD_L3_MISS_REMOTE_DRAM

    dram:
      mode: include
      # Power configuration: "auto" or list of subcomponent power settings
      power: auto
      # Or specify per-subcomponent power:
      # power:
      #   - id: package-0
      #     idle_power: 1.0
      #     max_power: 5.0
      # Metrics to collect: "*" for all metrics, or list of specific metric names
      # Available DRAM metrics:
      #   - DRAM_SOCKET_PID_MEMORY
      #   - DRAM_SOCKET_TOTAL_ENERGY
      metrics:
        - DRAM_SOCKET_TOTAL_ENERGY
        - DRAM_SOCKET_PID_MEMORY

    gpu:
      mode: include  # Set to 'include' to enable GPU monitoring
      # Power configuration: "auto" or list of subcomponent power settings
      power: auto
      # Or specify per-GPU power:
      # power:
      #   - id: 0
      #     idle_power: 20.0
      #     max_power: 75.0
      #   - id: 1
      #     idle_power: auto
      #     max_power: auto
      # Metrics to collect: "*" for all metrics, or list of specific metric names
      # Available GPU metrics:
      #   - GPU_DEVICE_TOTAL_MEMORY_USED
      #   - GPU_DEVICE_TOTAL_MEMORY_FREE
      #   - GPU_DEVICE_TOTAL_MEMORY
      #   - GPU_DEVICE_TOTAL_TEMPERATURE
      #   - GPU_DEVICE_TOTAL_MEMORY_UTILIZATION
      #   - GPU_DEVICE_TOTAL_COMPUTE_UTILIZATION
      #   - GPU_DEVICE_PID_MEMORY
      #   - GPU_DEVICE_PID_COMPUTE_UTILIZATION
      #   - GPU_DEVICE_PID_ENCODER_UTILIZATION
      #   - GPU_DEVICE_PID_DECODER_UTILIZATION
      #   - GPU_DEVICE_PID_FRAME_BUFFER_UTILIZATION
      #   - GPU_DEVICE_PID_ACTIVE_TIME
      metrics:
        - GPU_DEVICE_TOTAL_ENERGY
        - GPU_DEVICE_PID_COMPUTE_UTILIZATION

    network:
      mode: include  # Set to 'include' to enable network monitoring
      # Power configuration: "auto" or list of subcomponent power settings
      power: auto
      # Or specify per-interface power:
      # power:
      #   - id: eth0
      #     idle_power: 3.0
      #     max_power: 10.0
      # Metrics to collect: "*" for all metrics, or list of specific metric names
      metrics: "*"

